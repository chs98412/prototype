<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Logged — UI Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #E5E5E5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 0 64px;
      gap: 40px;
    }

    .screen-label {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .phone {
      width: 375px;
      min-height: 812px;
      background: #fff;
      border-radius: 40px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.18);
      overflow: hidden;
      position: relative;
    }

    .screen {
      width: 100%;
      min-height: 812px;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .landing {
      background: #fff;
      padding: 0 24px 40px;
      justify-content: space-between;
    }

    .landing-top {
      padding-top: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: #FF5733;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg { width: 22px; height: 22px; }

    .logo-text {
      font-size: 28px;
      font-weight: 800;
      color: #1A1A1A;
      letter-spacing: -0.5px;
    }

    .logo-text span { color: #FF5733; }

    .landing-hero {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .headline {
      font-size: 26px;
      font-weight: 700;
      color: #1A1A1A;
      line-height: 1.3;
      letter-spacing: -0.3px;
    }

    .sub-headline {
      font-size: 15px;
      color: #6B6B6B;
      line-height: 1.5;
    }

    .pills-wrap {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      background: #F5F5F5;
      border-radius: 9999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #1A1A1A;
      white-space: nowrap;
    }

    .landing-preview {
      margin: 28px -24px 0;
      background: #FFF8F6;
      border-top: 1px solid #FFE8E2;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .preview-label {
      font-size: 11px;
      font-weight: 600;
      color: #FF5733;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .preview-cards {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .preview-cards::-webkit-scrollbar { display: none; }

    .mini-card {
      min-width: 72px;
      background: #E5E5E5;
      border-radius: 8px;
      height: 100px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .mini-card-overlay {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      padding: 6px 4px 4px;
    }

    .mini-stars { display: flex; gap: 1px; }
    .mini-stars span { font-size: 8px; color: #FFC107; }

    .mini-card-bg-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .mini-card-bg-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .mini-card-bg-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .mini-card-bg-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }

    .streak-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid #E5E5E5;
    }

    .streak-icon { font-size: 20px; }
    .streak-text { font-size: 13px; font-weight: 600; color: #1A1A1A; }
    .streak-sub { font-size: 11px; color: #6B6B6B; }

    .landing-bottom {
      padding-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      width: 100%;
      height: 56px;
      background: #FF5733;
      color: white;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.9; }

    .login-hint {
      text-align: center;
      font-size: 13px;
      color: #6B6B6B;
    }

    .login-hint a { color: #FF5733; font-weight: 600; text-decoration: none; }

    .login {
      background: #fff;
      padding: 0 24px 40px;
    }

    .login-header {
      padding-top: 56px;
      display: flex;
      align-items: center;
      margin-bottom: 48px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      background: #F5F5F5;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #1A1A1A;
    }

    .login-logo-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 auto;
      padding-right: 36px;
    }

    .login-logo-icon {
      width: 28px;
      height: 28px;
      background: #FF5733;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-logo-icon svg { width: 15px; height: 15px; }

    .login-logo-text {
      font-size: 20px;
      font-weight: 800;
      color: #1A1A1A;
    }

    .login-logo-text span { color: #FF5733; }

    .login-body {
      display: flex;
      flex-direction: column;
      gap: 32px;
      flex: 1;
    }

    .login-heading {
      font-size: 22px;
      font-weight: 700;
      color: #1A1A1A;
      line-height: 1.3;
    }

    .auth-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-social {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    .btn-social:hover { opacity: 0.9; }
    .btn-google { background: #fff; border: 1.5px solid #E5E5E5; color: #1A1A1A; }
    .btn-kakao { background: #FEE500; color: #1A1A1A; }

    .social-icon { width: 22px; height: 22px; flex-shrink: 0; }

    .divider { display: flex; align-items: center; gap: 12px; }
    .divider-line { flex: 1; height: 1px; background: #E5E5E5; }
    .divider-text { font-size: 12px; color: #6B6B6B; }

    .btn-email {
      width: 100%;
      height: 52px;
      background: #F5F5F5;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #1A1A1A;
      cursor: pointer;
    }

    .btn-email:hover { background: #EBEBEB; }

    .terms-text {
      margin-top: auto;
      padding-top: 32px;
      font-size: 11px;
      color: #6B6B6B;
      text-align: center;
      line-height: 1.6;
    }

    .terms-text a { color: #1A1A1A; font-weight: 600; text-decoration: underline; }
  </style>
</head>
<body>

  <span class="screen-label">Screen 1 — Landing</span>
  <div class="phone">
    <div class="screen landing">
      <div class="landing-top">
        <div class="logo-wrap">
          <div class="logo-icon">
            <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="4" width="18" height="14" rx="2" stroke="white" stroke-width="1.8"/>
              <path d="M2 8h18" stroke="white" stroke-width="1.8"/>
              <circle cx="6" cy="6" r="1" fill="white"/>
              <circle cx="9" cy="6" r="1" fill="white"/>
              <path d="M9 13l2.5 2L16 11" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="logo-text">L<span>o</span>gged</span>
        </div>
        <div class="landing-hero">
          <div class="headline">당신의 영화 취향을<br/>기록하세요</div>
          <div class="sub-headline">도전과제, 스트릭, 취향 분석까지<br/>영화 마니아를 위한 플랫폼</div>
        </div>
        <div class="pills-wrap">
          <span class="pill">🎬 기록</span>
          <span class="pill">🏆 도전과제</span>
          <span class="pill">📊 취향 분석</span>
          <span class="pill">🔥 스트릭</span>
        </div>
      </div>
      <div class="landing-preview">
        <div class="preview-label">지금 인기 기록 중</div>
        <div class="preview-cards">
          <div class="mini-card mini-card-bg-1"><div class="mini-card-overlay"><div class="mini-stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div></div></div>
          <div class="mini-card mini-card-bg-2"><div class="mini-card-overlay"><div class="mini-stars"><span>★</span><span>★</span><span>★</span><span>★</span><span style="color:#aaa">★</span></div></div></div>
          <div class="mini-card mini-card-bg-3"><div class="mini-card-overlay"><div class="mini-stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div></div></div>
          <div class="mini-card mini-card-bg-4"><div class="mini-card-overlay"><div class="mini-stars"><span>★</span><span>★</span><span>★</span><span style="color:#aaa">★</span><span style="color:#aaa">★</span></div></div></div>
        </div>
        <div class="streak-preview">
          <span class="streak-icon">🔥</span>
          <div>
            <div class="streak-text">12일 연속 기록 중!</div>
            <div class="streak-sub">오늘도 한 편 기록해보세요</div>
          </div>
        </div>
      </div>
      <div class="landing-bottom">
        <button class="btn-primary">무료로 시작하기</button>
        <div class="login-hint">이미 계정이 있나요? <a href="#">로그인</a></div>
      </div>
    </div>
  </div>

  <span class="screen-label">Screen 2 — Login</span>
  <div class="phone">
    <div class="screen login">
      <div class="login-header">
        <button class="back-btn">←</button>
        <div class="login-logo-wrap">
          <div class="login-logo-icon">
            <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="4" width="18" height="14" rx="2" stroke="white" stroke-width="1.8"/>
              <path d="M2 8h18" stroke="white" stroke-width="1.8"/>
              <circle cx="6" cy="6" r="1" fill="white"/>
              <circle cx="9" cy="6" r="1" fill="white"/>
              <path d="M9 13l2.5 2L16 11" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="login-logo-text">L<span>o</span>gged</span>
        </div>
      </div>
      <div class="login-body">
        <div class="login-heading">시작하는 방법을<br/>선택하세요</div>
        <div class="auth-buttons">
          <button class="btn-social btn-google">
            <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google로 계속하기
          </button>
          <button class="btn-social btn-kakao">
            <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3C6.48 3 2 6.58 2 11c0 2.82 1.75 5.3 4.4 6.8L5.5 21l4.1-2.3c.78.13 1.58.2 2.4.2 5.52 0 10-3.58 10-8S17.52 3 12 3z" fill="#3A1D1D"/>
            </svg>
            카카오로 계속하기
          </button>
          <div class="divider"><div class="divider-line"></div><span class="divider-text">또는</span><div class="divider-line"></div></div>
          <button class="btn-email">이메일로 계속하기</button>
        </div>
        <div class="terms-text">
          가입 시 <a href="#">서비스 이용약관</a> 및<br/>
          <a href="#">개인정보처리방침</a>에 동의합니다
        </div>
      </div>
    </div>
  </div>

</body>
</html>
